name: Update Fund Forecast Data

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      test_discord_notify:
        description: "Discordへテスト通知を1回即時送信する"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-forecast-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests jpholiday

      - name: Run continuous forecast data updater
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_DISCORD_TEST: ${{ inputs.test_discord_notify }}
        run: python scripts/loop_update.py --interval 300 --max-minutes 345
